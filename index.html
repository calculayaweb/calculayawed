<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalculaYa - Calculadoras gratis</title>
  <meta name="description" content="Calculadoras online gratis, rápidas y fáciles de usar.">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    header p {
      color: #d1d5db;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .resultado {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>CalculaYa</h1>
  <p>Calculadoras online gratis, rápidas y fáciles</p>
</header>

<div class="container">

  <div class="card">
    <h2>🧮 Calculadora básica</h2>

    <input type="number" id="num1" placeholder="Primer número">
    <input type="number" id="num2" placeholder="Segundo número">

    <button onclick="sumar()">Sumar</button>
    <button onclick="restar()">Restar</button>
    <button onclick="multiplicar()">Multiplicar</button>
    <button onclick="dividir()">Dividir</button>

    <div class="resultado" id="resultado"></div>
  </div>

  <div class="card">
    <h2>📊 Calculadora de porcentaje</h2>

    <input type="number" id="cantidad" placeholder="Cantidad">
    <input type="number" id="porcentaje" placeholder="Porcentaje">

    <button onclick="calcularPorcentaje()">Calcular</button>

    <div class="resultado" id="resultadoPorcentaje"></div>
  </div>

  <div class="card">
    <h2>🎂 Calculadora de edad</h2>

    <input type="date" id="fechaNacimiento">

    <button onclick="calcularEdad()">Calcular edad</button>

    <div class="resultado" id="resultadoEdad"></div>
  </div>

</div>

<footer>
  © 2026 CalculaYa · Calculadoras gratis
</footer>

<script>

function obtenerNumeros() {
  return {
    a: parseFloat(document.getElementById("num1").value),
    b: parseFloat(document.getElementById("num2").value)
  };
}

function sumar() {
  const {a,b} = obtenerNumeros();
  document.getElementById("resultado").innerText = "Resultado: " + (a+b);
}

function restar() {
  const {a,b} = obtenerNumeros();
  document.getElementById("resultado").innerText = "Resultado: " + (a-b);
}

function multiplicar() {
  const {a,b} = obtenerNumeros();
  document.getElementById("resultado").innerText = "Resultado: " + (a*b);
}

function dividir() {
  const {a,b} = obtenerNumeros();

  if (b === 0) {
    document.getElementById("resultado").innerText = "No se puede dividir entre 0";
    return;
  }

  document.getElementById("resultado").innerText = "Resultado: " + (a/b);
}

function calcularPorcentaje() {
  const cantidad = parseFloat(document.getElementById("cantidad").value);
  const porcentaje = parseFloat(document.getElementById("porcentaje").value);

  const resultado = cantidad * porcentaje / 100;

  document.getElementById("resultadoPorcentaje").innerText =
    porcentaje + "% de " + cantidad + " = " + resultado;
}

function calcularEdad() {

  const fecha = new Date(document.getElementById("fechaNacimiento").value);
  const hoy = new Date();

  let edad = hoy.getFullYear() - fecha.getFullYear();

  const mes = hoy.getMonth() - fecha.getMonth();

  if (mes < 0 || (mes === 0 && hoy.getDate() < fecha.getDate())) {
    edad--;
  }

  document.getElementById("resultadoEdad").innerText =
    "Tienes " + edad + " años";
}

</script>

</body>
</html>
